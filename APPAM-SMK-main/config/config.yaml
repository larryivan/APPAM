samples_file: "config/samples.tsv"
paths:
  raw_data_dir: "path/to/raw"
  results_dir: "path/to/results"
  logs_dir: "path/to/logs"
  benchmark_dir: "path/to/benchmark"
params:
  preprocess_method: "fastp"  # adapter_removal | fastp
  fastp_detect_adapter_for_pe: true
  adapter1: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCACCGATTCGATCTCGTATGCCGTCTTCTGCTTG"
  adapter2: "AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGTAGATCTCGGTGGTCGCCGTATCATTT"

  min_contig_len: 500
  bin_completeness: 50
  bin_contamination: 10
  pydamage_window: 35
  # Damage filtering is an experimental ablation. Conservative runs bin all contigs.
  use_ancient_contigs: false
  pydamage_contig_column: "reference"
  pydamage_qvalue_column: "qvalue"
  pydamage_qvalue_max: 0.05
  pydamage_predicted_accuracy_column: "predicted_accuracy"
  pydamage_predicted_accuracy_min: 0.5
  enable_bin_refinement: false
  unrefined_binner: "metabat2"
  enable_checkm1: false
  enable_checkm2: true
  enable_gunc: true
  enable_gtdbtk: true
  enable_prokka: true
  enable_eggnog: false
  enable_abricate: false
  enable_rgi: false
  enable_antismash: false
  enable_variants: false
  annotation_threads: 8
  abricate_db: "vfdb"
  abricate_minid: 80
  abricate_mincov: 80

databases:
  checkm_db: "/path/to/checkm1_db"
  checkm1_db: "/path/to/checkm1_db"
  checkm2_db: "/path/to/checkm2_db"
  gunc_db: "/path/to/gunc_db_or_dmnd"
  gtdbtk_db: "/path/to/gtdbtk_db"
  eggnog_db: "/path/to/eggnog_db"
  abricate_db: "builtin"
  rgi_db_mode: "global"
  rgi_db: ""
  antismash_db: "builtin"
  prokka_db: "builtin"

tools:
  preprocessing_env: "/path/to/preprocessing_env"
  mapping_env: "/path/to/mapping_env"
  assembly_env: "/path/to/assembly_env"
  metawrap_env: "/path/to/metawrap_env"
  pydamage_env: "/path/to/pydamage_env"
  checkm1_env: "/path/to/checkm1_env"
  checkm2_env: "/path/to/checkm2_env"
  gunc_env: "/path/to/gunc_env"
  gtdbtk_env: "/path/to/gtdbtk_env"
  prokka_env: "/path/to/prokka_env"
  eggnog_env: "/path/to/eggnog_py310_env"
  abricate_env: "/path/to/abricate_env"
  rgi_env: "/path/to/rgi_env"
  antismash_env: "/path/to/antismash_env"
  freebayes_env: "/path/to/freebayes_env"
  bcftools_env: "/path/to/bcftools_env"
  reporting_env: "/path/to/reporting_env"

variants:
  min_alternate_fraction: 0.33
  min_base_quality: 20
  min_variant_quality: 30
  rescue_variant_quality: 20
  rescue_alternate_observations: 2

visualization:
  enabled: true
  reads_length_bin_size: 10
  ani_bin_start: 95
  ani_bin_end: 100
  ani_bin_step: 1
  rose_chart_min_fraction: 0.01
  species_top_n: 10
