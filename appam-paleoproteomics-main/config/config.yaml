sample_table: config/samples.tsv
mqpar_template: workflow/templates/mqpar.template.xml
results_dir: results
maxquant_output_dir: results/maxquant
threads: 4
runtime_env: /opt/conda/envs/paleoproteomics
maxquant_version: 2.8.1.0
maxquant_mode: batch  # batch | per_sample_id

fasta_path: /path/to/reference.fasta
match_between_runs: false
enzymes:
  - Trypsin/P
enzyme_mode: 4
max_missed_cleavages: 0
max_missed_cleavages_dia: 0
identifier_parse_rule: '^>(?:sp\||tr\|)?([^|\s]+)'
description_parse_rule: '^\S+\s+(.*)$'
fixed_modifications:
  - Carbamidomethyl (C)
variable_modifications:
  - Deamidation (NQ)
  - Oxidation (MP)
  - Gln->pyro-Glu
  - Glu->pyro-Glu
  - Phospho (ST)
peptide_fdr: 0.01
protein_fdr: 0.01
site_fdr: 0.01
include_contaminants: true
min_peptide_length: 7
first_search_tol: 20
main_search_tol: 4.5

dotnet_bin: dotnet
maxquant_cmd_dll: /opt/tools/maxquant-current/bin/MaxQuantCmd.dll
thermo_raw_file_parser: ThermoRawFileParser
timsconvert_bin: timsconvert
openms_fileconverter: FileConverter
